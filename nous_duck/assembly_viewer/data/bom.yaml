    note_zh: 兩顆串聯成 2S（標稱 7.4 V、充滿 8.4 V）。上游建議買放電能力最強的，原作者用 3000 mAh、30 A。裝進電池座前，兩顆要先充到相同電壓。
    note_en: Two cells in series (2S, 7.4 V nominal, 8.4 V full). Upstream recommends the highest-discharge cells you can find; the author uses 3000 mAh, 30 A. Charge both to the same voltage before putting them in the holder.

