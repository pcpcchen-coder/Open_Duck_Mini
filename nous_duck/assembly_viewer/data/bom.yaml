# CAD 有、但上游 BOM 和列印清單都沒有的零件。必須在這裡列出原因，否則 pipeline 會失敗。
cad_without_bom:
  - mesh: antenna
    reason_zh: 上游列印清單與 BOM 都沒有這個零件，材質與取得方式未說明。
    reason_en: Neither the upstream print list nor the BOM includes this part; its material and source are not stated.
