# BOM：Open Duck Mini v2 原版的採購件、耗材與工具。
#
# 列印件不寫在這裡：36 種列印件由 pipeline 依 cad_parts.yaml 與上游 docs/print_guide.md 自動產生，
# 避免兩份清單不同步。
#
# 每一項的欄位：
#   id              唯一識別（英文）
#   category        servo / electronics / power / connector / wire / hardware / material / tool
#   name_zh/name_en 名稱
#   qty             數量；上游沒寫的填 null，並在 qty_note 說明
#   source          數量與品項的來源：upstream_bom（上游 BOM）／assembly_guide（上游組裝說明）
#   upstream        對應上游 BOM（nous_duck/docs/handoff/upstream_bom.csv）的列：
#                   csv_row 是 CSV 的第幾筆記錄（從 1 起算，空白列也算），其餘照抄原文。測試會逐項比對。
#   scene           這一項在 3D 模型中是哪些零件（選擇器，見 steps.yaml 開頭說明）；
#                   CAD 沒有的零件不寫 scene，改寫 scene_note 說明為什麼不顯示。
#   package         basic（上游基本 BOM）或 expression（上游的「Expression package」選配）
#
# 不憑空補規格：上游沒寫的型號、長度、數量一律不填，寫在 note 裡。
# 價格是上游原作者以歐元、法國通路估的，不代表台灣價格。
version: 1

items:
  # ---------------- 舵機 ----------------
  - id: sts3215
    category: servo
    package: basic
    name_zh: Feetech STS3215 串列舵機（7.4 V）
    name_en: Feetech STS3215 serial bus servo (7.4 V)
    qty: 14
    source: upstream_bom
    upstream: {csv_row: 18, name: "Feetech 7.4v STS 3215", qty: 14, unit_price_eur: 14}
    scene: [{servos: all}]
    note_zh: 一定要買 7.4 V 版本（上游註明「also called 19kg.cm」）。每顆附的塑膠螺絲用來鎖塑膠件。
    note_en: Buy the 7.4 V version (upstream calls it "19kg.cm"). The plastic screws that come with each servo are used for printed parts.

  - id: antenna_servo
    category: servo
    package: basic
    name_zh: 9 g 小舵機（天線）
    name_en: 9 g micro servo (antennas)
    qty: 2
    source: upstream_bom
    upstream: {csv_row: 20, name: "9g servos", qty: 2, unit_price_eur: 3.33}
    scene: [{mesh: sg90}]
    note_zh: PWM 控制，接 Pi Zero 的 GPIO 12、13（上游腳位表）。
    note_en: PWM controlled, wired to Pi Zero GPIO 12 and 13 (upstream pin table).

  # ---------------- 控制與感測 ----------------
  - id: pi_zero_2w
    category: electronics
    package: basic
    name_zh: Raspberry Pi Zero 2 W
    name_en: Raspberry Pi Zero 2 W
    qty: 1
    source: upstream_bom
    upstream: {csv_row: 15, name: "Raspberry pi zero 2w", qty: 1, unit_price_eur: 26.08}
    scene: [{mesh: raspberrypizerow}]

  - id: sd_card
    category: electronics
    package: basic
    name_zh: microSD 卡
    name_en: microSD card
    qty: 1
    source: upstream_bom
    upstream: {csv_row: 16, name: "SD card", qty: 1, unit_price_eur: 10}
    scene_note_zh: 插在 Pi Zero 上，CAD 沒有建模。
    scene_note_en: Goes into the Pi Zero; not modeled in the CAD.

  - id: servo_driver
    category: electronics
    package: basic
    name_zh: 舵機驅動板（Waveshare Bus Servo Adapter (A)）
    name_en: Servo driver board (Waveshare Bus Servo Adapter (A))
    qty: 1
    source: upstream_bom
    upstream: {csv_row: 17, name: "Servo control board", qty: 1, unit_price_eur: 5}
    scene: [{mesh: board, body: trunk_assembly}]
    note_zh: 型號來自上游 BOM 的連結（waveshare.com/bus-servo-adapter-a）。3D 中是 CAD 的通用電路板外形，位置依接線圖推定。
    note_en: Model taken from the upstream BOM link (waveshare.com/bus-servo-adapter-a). Shown with the CAD's generic board shape; placement inferred from the wiring diagram.

  - id: imu_bno055
    category: electronics
    package: basic
    name_zh: BNO055 IMU
    name_en: BNO055 IMU
    qty: 1
    source: upstream_bom
    upstream: {csv_row: 14, name: "IMU (BNO055)", qty: 1, unit_price_eur: 40}
    scene: [{mesh: bno055}]
    note_zh: 接 Pi Zero 的 I2C（SDA GPIO 2、SCL GPIO 3）。上游說裝反也可以，之後在設定裡補償。
    note_en: Uses the Pi Zero I2C bus (SDA GPIO 2, SCL GPIO 3). Upstream says mounting it upside down is fine and can be configured later.

  - id: foot_switch
    category: electronics
    package: basic
    name_zh: 足底開關（SS-10）
    name_en: Foot contact switch (SS-10)
    qty: 4
    source: upstream_bom
    upstream: {csv_row: 19, name: "Feet contact switches (SS-10)", qty: 4, unit_price_eur: 1}
    scene_note_zh: CAD 沒有建模。壓入腳底，腳掌著地時觸發。
    scene_note_en: Not modeled in the CAD. Press-fit into the foot so it triggers when the foot touches the ground.
    note_zh: 上游 BOM 寫 4 顆，但腳位表每隻腳只有一個訊號腳位（左腳 GPIO 22、右腳 GPIO 27）；每隻腳要裝幾顆，上游沒有寫。
    note_en: The upstream BOM lists 4, but the pin table has one signal pin per foot (left GPIO 22, right GPIO 27). Upstream does not say how many go in each foot.

  # ---------------- 電源 ----------------
  - id: cell_18650
    category: power
    package: basic
    name_zh: 18650 動力電池
    name_en: 18650 cell
    qty: 2
    source: upstream_bom
