# Nous Duck：讓「本機喚醒詞偵測」和「Chromium 語音終端」同時讀同一支麥克風（XVF3800）。
#
# ALSA 的硬體收音裝置一次只能被一個程式打開；dsnoop 讓多個程式各拿一份相同的收音資料。
# 用法：兩邊都開 `duck_mic`（不要直接開 hw:Array）。
#   喚醒服務：arecord -D duck_mic …；Chromium：--alsa-input-device=duck_mic
# 這個檔由 deploy_voice.sh 放到 ~/duck/voice/alsa/，用環境變數 ALSA_CONFIG_PATH 載入，
# 不改 ~/.asoundrc、不改 /etc。2026-11-26 在 Pi 4 上實測可同時開兩個讀取端。
pcm.duck_mic_raw {
    type dsnoop
    ipc_key 884711
    ipc_perm 0660
    slave {
        pcm "hw:CARD=Array,DEV=0"
        rate 16000
        channels 2
        format S16_LE
        period_size 320
        buffer_size 3200
    }
}
pcm.duck_mic {
    type plug
    slave.pcm "duck_mic_raw"
    hint.description "Nous Duck shared microphone (XVF3800 via dsnoop)"
}
# Chromium 會找同名的混音器；指到 XVF3800，免得每次都印錯誤訊息。
ctl.duck_mic {
    type hw
    card Array
}
