<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>鴨子設定</title>
<style>
:root {
  --bg: #f6f4ee; --card: #ffffff; --ink: #1f2328; --muted: #646b73; --line: #dedad0; --accent: #b86a00; --accent-ink: #ffffff;

@media (prefers-color-scheme: dark) {

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; scroll-padding-top: 108px; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.55 -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif; padding-bottom: 96px; }
header { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); padding: 10px 16px 0; }
.top { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; max-width: 880px; margin: 0 auto; }
h1 { font-size: 20px; margin: 0; letter-spacing: .02em; }
.sub { color: var(--muted); font-size: 13px; }
nav { display: flex; gap: 6px; overflow-x: auto; padding: 10px 0; max-width: 880px; margin: 0 auto; scrollbar-width: none; }
nav::-webkit-scrollbar { display: none; }
nav a { flex: none; text-decoration: none; color: var(--ink); background: var(--chip); border-radius: 999px; padding: 6px 12px; font-size: 14px; }
nav a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
main { max-width: 880px; margin: 0 auto; padding: 8px 16px 0; }
section { margin: 22px 0 0; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h2 { font-size: 18px; margin: 0; }
.sec-desc { color: var(--muted); font-size: 14px; margin: 2px 0 10px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; margin: 10px 0; }
.card.blocked { background: transparent; border-style: dashed; }
.card.dirty { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
.row { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.label { font-weight: 600; }
.desc { color: var(--muted); font-size: 14px; margin-top: 2px; }

.chip { background: var(--chip); border-radius: 999px; padding: 2px 9px; white-space: nowrap; }
.chip.ok { color: var(--ok); } .chip.warn { color: var(--warn); } .chip.bad { color: var(--bad); } .chip.off { color: var(--off); }
.chip.status { border: 1px solid currentColor; background: transparent; font-weight: 600; }
.why { font-size: 13px; color: var(--muted); margin-top: 8px; }
.err { color: var(--bad); font-size: 14px; margin-top: 8px; font-weight: 600; }
.control { margin-top: 12px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
input[type=range] { flex: 1 1 180px; min-width: 140px; accent-color: var(--accent); height: 32px; }
input[type=number], input[type=time], select { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; min-height: 42px; }
input[type=number] { width: 124px; font-variant-numeric: tabular-nums; }
select { max-width: 100%; }
.unit { color: var(--muted); font-size: 14px; }
.switch { position: relative; flex: none; width: 54px; height: 32px; }
.switch input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
.switch span { position: absolute; inset: 0; background: var(--off); border-radius: 999px; transition: background .15s; pointer-events: none; }
.switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: #fff; transition: transform .15s; }

.switch input:checked + span::after { transform: translateX(22px); }
.switch input:disabled { cursor: not-allowed; }
.switch input:disabled + span { opacity: .45; }
.switch input:focus-visible + span { outline: 2px solid var(--focus); outline-offset: 2px; }
button { font: inherit; color: var(--ink); background: var(--chip); border: 1px solid var(--line); border-radius: 10px; padding: 8px 14px; min-height: 42px; cursor: pointer; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; font-weight: 700; }
button.link { background: none; border: none; padding: 0 2px; min-height: 0; color: var(--accent); text-decoration: underline; font-size: 12.5px; }
button.small { min-height: 34px; padding: 4px 10px; font-size: 13px; }
button:disabled { opacity: .5; cursor: not-allowed; }
details { margin-top: 10px; }
summary { cursor: pointer; color: var(--muted); font-size: 14px; padding: 6px 0; }
.banner { border-radius: var(--radius); padding: 12px 14px; margin: 12px 0; font-size: 14px; border: 1px solid var(--line); background: var(--card); }
.banner.bad { border-color: var(--bad); color: var(--bad); }
.banner.warn { border-color: var(--warn); }
.savebar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--card); border-top: 1px solid var(--line); padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); display: none; }
.savebar.on { display: block; }
.savebar > div { max-width: 880px; margin: 0 auto; display: flex; align-items: center; gap: 10px; justify-content: space-between; flex-wrap: wrap; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: 96px; z-index: 7; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 14px; max-width: min(92vw, 560px); display: none; }
.toast.on { display: block; }
.toast.bad { background: var(--bad); color: #fff; }
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.expr { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px; text-align: center; }
.expr img { width: 100%; max-width: 200px; height: auto; image-rendering: auto; border-radius: 8px; background: #000; display: block; margin: 0 auto 6px; }
.expr .n { font-weight: 600; } .expr .i { color: var(--muted); font-size: 12.5px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
.expr .t { font-size: 12px; color: var(--muted); margin: 4px 0 8px; min-height: 2.6em; }
.thumb { width: 104px; height: auto; border-radius: 6px; background: #000; flex: none; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
td, th { text-align: left; padding: 6px 8px 6px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 500; width: 38%; }
table { table-layout: fixed; }
td, th, .desc, .why, .label { overflow-wrap: anywhere; }
td .chip { white-space: normal; }
ul.plain { margin: 6px 0 0; padding-left: 18px; font-size: 14px; color: var(--muted); }
code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .92em; background: var(--chip); padding: 1px 5px; border-radius: 5px; word-break: break-all; }
.confirm { display: flex; gap: 8px; align-items: flex-start; font-size: 14px; }
.confirm input { width: 22px; height: 22px; margin-top: 1px; accent-color: var(--accent); flex: none; }
@media (max-width: 480px) { body { font-size: 15.5px; } .card { padding: 12px; } input[type=number] { width: 108px; } }
</style>
</head>
<body>
<header>
  <div class="top"><h1>鴨子設定</h1><span class="sub" id="conn">連線中…</span></div>
  <nav id="nav" aria-label="分區"></nav>
</header>
<main id="main"><div class="banner" id="boot">正在讀取設定…</div></main>
<div class="savebar" id="savebar"><div><span id="dirtycount"></span><span><button id="discard">放棄</button> <button class="primary" id="save">儲存</button></span></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

        d.presence ? "・presence " + d.presence : "", d.expression ? "・表情 " + d.expression : "", (d.faults || []).length ? "・異常：" + d.faults.join("、") : ""].join(""))),
    h("tr", {}, h("th", {}, "Pi"), h("td", {}, [pi.hostname || "", pi.cpu_temp_c != null ? "・CPU " + pi.cpu_temp_c + " °C" : "", pi.load1 != null ? "・負載 " + pi.load1 : ""].join(""))),
    h("tr", {}, h("th", {}, "設定檔"), h("td", {}, h("code", {}, state.directory), "・偏好第 " + state.revision.preference + " 版・量測值第 " + state.revision.measurement + " 版")),
    h("tr", {}, h("th", {}, "存取"), h("td", {}, "只接受家裡區網內的裝置・" + (state.access.token_required ? "要 token" : "不需要 token（同一個網路裡的人都能改這一頁）")))))));
  if ((state.problems || []).length) frag.append(h("div", { class: "banner bad" }, h("div", { class: "label" }, "設定檔有問題"), h("ul", { class: "plain" }, state.problems.map((p) => h("li", {}, p)))));
  frag.append(h("div", { class: "card" }, h("div", { class: "row" }, h("div", {}, h("div", { class: "label" }, "還原上一版"), h("div", { class: "desc" }, "把使用者偏好改回上一次儲存之前的樣子。量測值不動；會放寬隱私的項目不會被還原。")),
    h("button", { disabled: !state.has_previous, onclick: restorePrevious }, "還原"))));
  frag.append(h("div", { class: "card blocked" }, h("div", { class: "label" }, "不在這一頁的東西"), h("ul", { class: "plain" }, state.never_here.map((t) => h("li", {}, t)))));
  const ch = state.changes || [];
  frag.append(h("div", { class: "card" }, h("div", { class: "label" }, "最近的變更"), !ch.length ? h("div", { class: "desc" }, "還沒有變更紀錄。") :
    h("table", {}, h("tbody", {}, ch.map((c) => h("tr", {}, h("th", {}, new Date(c.at * 1000).toLocaleString("zh-TW", { hour12: false })),
      h("td", {}, ({ web: "設定頁", local_cli: "本機指令", duck_link: "Nous" })[c.source] || c.source, c.from ? " " + c.from : "", c.note ? "（" + c.note + "）" : "", "：",
        Object.entries(c.changes).map(([k, v]) => k + " " + JSON.stringify(v.from) + " → " + JSON.stringify(v.to)).join("；"))))))));
  return frag;
}
function render() {
  const y = window.scrollY;
  const main = $("main"); main.textContent = "";
  if (stale) main.append(h("div", { class: "banner warn" }, "設定被別的地方改過了（另一支手機，或本機指令）。你還沒儲存的修改是照舊的值做的。 ", h("button", { class: "small", onclick: () => { dirty = {}; errors = {}; stale = false; render(); refreshSavebar(); } }, "放棄我的修改並重新載入")));
  state.sections.forEach((sec) => main.append(sectionEl(sec)));
  main.append(systemEl());
  const nav = $("nav"); nav.textContent = "";
  state.sections.concat([{ id: "system", label: "系統狀態" }]).forEach((s) => nav.append(h("a", { href: "#sec-" + s.id, onclick: (ev) => { ev.preventDefault(); document.getElementById("sec-" + s.id).scrollIntoView(); } }, s.label)));
  window.scrollTo(0, y);
}
function mergeState(next) {
  const rev = JSON.stringify(next.revision);
  const changed = rev !== lastRev;
  state = next; lastRev = rev;
  if (changed && Object.keys(dirty).length) stale = true;
  return changed;
}
async function load(full) {
  try {
    const next = await api("/api/state");
    const active = document.activeElement && /INPUT|SELECT/.test(document.activeElement.tagName);
    const changed = mergeState(next);
    $("conn").textContent = "已連上 " + (next.pi.hostname || "鴨子") + "・v" + next.version;
    if (changed) needsRender = true;
    if (full || !$("sysbody") || (needsRender && !active)) { needsRender = false; render(); }
    else {  // 沒有新版本：只更新生效狀態與系統狀態，不動正在編輯的欄位
      next.settings.forEach((s) => { const c = document.querySelector('[data-effect="' + s.key + '"]'); if (c) c.replaceWith(effectChip(s)); });
      const body = $("sysbody"); body.textContent = ""; body.append(sysBody());
    }
  } catch (e) {
    $("conn").textContent = "沒有連上";
    if (!state) { const b = $("boot"); if (b) { b.className = "banner bad"; b.textContent = e.error || "讀不到設定"; } }
  }
}
async function loadExpressions() {
  try { expressions = await api("/api/expressions"); } catch (e) { expressions = { available: false, reason: e.error || "讀不到預覽圖", expressions: [] }; }
  if (state && !(document.activeElement && /INPUT|SELECT/.test(document.activeElement.tagName))) render();
}
function showErrors(e) {
  errors = {};
  const general = [];
  for (const [k, why] of Object.entries(e.errors || {})) { if (state.settings.some((s) => s.key === k)) errors[k] = why; else general.push(why); }
  render();
  const first = Object.keys(errors)[0];
  if (first && $("card-" + first)) $("card-" + first).scrollIntoView({ block: "center" });
  toast("沒有儲存：" + (general[0] || (first ? errors[first] : e.error || "原因不明")), true);
}
async function save() {
  const bad = Object.keys(dirty).filter((k) => errors[k]);
  if (bad.length) { toast("有欄位不是數字，先改好再儲存", true); return; }
  const tightening = state.settings.filter((s) => s.key in dirty && s.privacy && s.tighten.indexOf(dirty[s.key]) > s.tighten.indexOf(s.value));
  if (tightening.length && !confirm("要收緊這些隱私設定嗎？\n\n" + tightening.map((s) => "・" + s.label + " → " + fmt(s, dirty[s.key])).join("\n") + "\n\n收緊之後，這一頁不能再放寬，要登入鴨子本機才能改回來。")) return;
  saving = true; refreshSavebar();
  try {
    const r = await api("/api/save", { changes: dirty, base_revision: state.revision, confirm_measurements: confirmCal });
    dirty = {}; errors = {}; stale = false;
    await load(true);
    const n = Object.keys(r.changed).length;
    const restart = state.settings.filter((s) => s.key in r.changed && s.apply === "restart").map((s) => s.consumer);
    toast(n ? "已儲存 " + n + " 項。" + (restart.length ? "其中有的要重啟 " + [...new Set(restart)].join("、") + " 才生效。" : "") : "值沒有變，沒有東西要存。");
  } catch (e) { if (e.code === "conflict") { stale = true; render(); toast(e.error, true); } else showErrors(e); }
  saving = false; refreshSavebar();
}
async function resetSection(sec, items) {
  if (!confirm("把「" + sec.label + "」這一區的設定都改回預設值嗎？")) return;
  try {
    const r = await api("/api/reset", { keys: items.map((s) => s.key), base_revision: state.revision });
    items.forEach((s) => { delete dirty[s.key]; delete errors[s.key]; });
    await load(true); refreshSavebar();
    const skipped = Object.values(r.skipped || {});
    toast("已改回預設 " + Object.keys(r.changed).length + " 項。" + (skipped.length ? "有 " + skipped.length + " 項沒動：" + skipped[0] : ""));
  } catch (e) { toast("沒有回復：" + (e.error || "原因不明"), true); }
}
async function restorePrevious() {
  if (!confirm("把使用者偏好還原成上一版嗎？")) return;
  try {
    const r = await api("/api/restore_previous", {});
    dirty = {}; errors = {}; await load(true); refreshSavebar();
    const skipped = Object.values(r.skipped || {});
    toast("已還原 " + Object.keys(r.changed).length + " 項。" + (skipped.length ? "有 " + skipped.length + " 項沒動：" + skipped[0] : ""));
  } catch (e) { toast("沒有還原：" + (e.error || "原因不明"), true); }
}
async function previewOnDuck(e) {
  try { const r = await api("/api/preview_expression", { name: e.id }); toast("duckd 已顯示「" + e.name + "」" + r.seconds + " 秒（" + (r.panel === "virtual_png" ? "虛擬面板，不是實體螢幕" : r.panel) + "）。"); }
  catch (err) { toast("不能預覽：" + (err.error || "原因不明"), true); }
}
$("save").addEventListener("click", save);
$("discard").addEventListener("click", () => { dirty = {}; errors = {}; stale = false; render(); refreshSavebar(); });
window.addEventListener("beforeunload", (ev) => { if (Object.keys(dirty).length) { ev.preventDefault(); ev.returnValue = ""; } });
load(true).then(loadExpressions);
setInterval(() => { if (!saving && !document.hidden) load(false); }, 3000);
</script>
</body>
