name: nous-duck-ci

on:
  push:
    branches: [v2, "claude/**"]
  pull_request:

permissions:
  contents: read

jobs:
  upstream-untouched:
    name: 上游檔案未修改
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 取得上游 v2
        run: |
          git remote add upstream https://github.com/apirrone/Open_Duck_Mini.git
          git fetch --no-tags upstream v2
      - name: 檢查差異只在 nous_duck/、CLAUDE.md、.github/
        run: bash nous_duck/tools/check_upstream_untouched.sh upstream/v2

  viewer-pipeline:
    name: 組裝檢視器 pipeline 測試
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: 安裝依賴
        run: pip install -r nous_duck/assembly_viewer/pipeline/requirements-dev.txt
      - name: 建置 scene.json 與 meshes.bin
        working-directory: nous_duck/assembly_viewer/pipeline
        run: python -m viewer_pipeline
      - name: 執行測試（含 MuJoCo 交叉驗證）
        run: python -m pytest nous_duck/assembly_viewer/tests/pipeline -v

  dock-cad:
    name: 充電座 CAD 測試
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: 安裝依賴
        run: pip install -r nous_duck/hardware/dock/cad/requirements-dev.txt
      - name: 執行測試（列印性、與鴨子的干涉與觸點對位、STL 與程式一致、AprilTag）
        run: python -m pytest nous_duck/hardware/dock/cad/tests -v
