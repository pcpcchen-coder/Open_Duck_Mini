name: nous-duck-ci

on:
  push:
    branches: [v2, "claude/**"]
  pull_request:

permissions:
  contents: read

jobs:
  upstream-untouched:
    name: 上游檔案未修改
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 取得上游 v2
        run: |
          git remote add upstream https://github.com/apirrone/Open_Duck_Mini.git
          git fetch --no-tags upstream v2
      - name: 檢查差異只在 nous_duck/、CLAUDE.md、.github/
        run: bash nous_duck/tools/check_upstream_untouched.sh upstream/v2

  viewer-pipeline:
    name: 組裝檢視器 pipeline 測試
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: 安裝依賴
        run: pip install -r nous_duck/assembly_viewer/pipeline/requirements-dev.txt
      - name: 建置 scene.json 與 meshes.bin
        working-directory: nous_duck/assembly_viewer/pipeline
        run: python -m viewer_pipeline
      - name: 執行測試（含 MuJoCo 交叉驗證與組裝步驟檢查）
        run: python -m pytest nous_duck/assembly_viewer/tests/pipeline -v

  viewer-web:
    name: 組裝檢視器前端（建置、輸出檢查、無頭瀏覽器）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: nous_duck/assembly_viewer/web/package-lock.json
      - name: 產生 pipeline 輸出（scene.json、meshes.bin、steps.json）
        working-directory: nous_duck/assembly_viewer/pipeline
        run: |
          pip install -r requirements.txt
          python -m viewer_pipeline
      - name: 安裝前端依賴
        working-directory: nous_duck/assembly_viewer/web
        run: npm ci
      - name: 型別檢查
        working-directory: nous_duck/assembly_viewer/web
        run: npm run typecheck
      - name: 打包單一 HTML 並檢查輸出
        working-directory: nous_duck/assembly_viewer/web
        run: |
          npm run build
          npm run check
      - name: 檢查 release/duck_viewer.html 和原始碼一致
        working-directory: nous_duck/assembly_viewer/web
        run: npm run check:release
      - name: 打包舵機控制台頁面
        working-directory: nous_duck/assembly_viewer/web
        run: npm run build:console
      - name: 安裝 Playwright 與 Chromium
        working-directory: nous_duck/assembly_viewer/web
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: 無頭瀏覽器檢查（斷網開啟、15 步、搜尋與點選、手機寬度）
        env:
          NODE_PATH: ${{ github.workspace }}/nous_duck/assembly_viewer/web/node_modules
        run: node nous_duck/assembly_viewer/tests/web/check_viewer.cjs
      - name: 上傳截圖與結果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: viewer-web-screens
          path: nous_duck/assembly_viewer/dist/screens/
          if-no-files-found: ignore

  servo-console:
    name: 舵機控制台單元測試（模擬匯流排）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: 安裝依賴
        run: pip install -r nous_duck/robot/servo_console/requirements-dev.txt
      - name: 執行測試
        run: python -m pytest nous_duck/robot/servo_console/tests -v

  dock-cad:
    name: 充電座 CAD 測試
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: 安裝依賴
        run: pip install -r nous_duck/hardware/dock/cad/requirements-dev.txt
      - name: 執行測試（列印性、與鴨子的干涉與觸點對位、STL 與程式一致、AprilTag）
        run: python -m pytest nous_duck/hardware/dock/cad/tests -v

  eye-display-fit:
    name: 眼睛螢幕尺寸核對（上游 STL）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: 內建檢查（眼孔、螺絲孔、頭殼內高、SPI 頻寬）
        run: python3 -I nous_duck/tools/eye_display_fit.py --check

  robot-eyes:
    name: 眼睛渲染程式測試
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: 安裝依賴
        run: pip install -r nous_duck/robot/eyes/requirements-dev.txt
      - name: 執行測試（狀態環規則、青色保留、表情、動畫、文件一致）
        working-directory: nous_duck/robot/eyes
        run: python -m pytest tests -v
      - name: 產生預覽圖（總覽、狀態環）
        working-directory: nous_duck/robot/eyes
        run: python -m duck_eyes.preview --out ../../../eyes-preview --no-gif --bench
      - name: 上傳預覽圖
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eyes-preview
          path: eyes-preview/
          if-no-files-found: ignore

  look-at:
    name: 說話時看著對方（控制器單元測試、MuJoCo 模擬）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: 安裝依賴
        run: |
          pip install -r nous_duck/robot/requirements-dev.txt
          pip install -r nous_duck/sim/requirements-dev.txt
      - name: 控制器單元測試
        run: python -m pytest nous_duck/robot/tests -v
      - name: 模擬（固定機身、合成人臉偵測）
        run: python -m pytest nous_duck/sim/tests -v

  duck-link-protocol:
    name: duck-link 協定 schema 測試
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: 安裝依賴
        run: pip install jsonschema==4.26.0 pytest==9.2.0
      - name: 合法範例通過、不合法範例被拒
        run: python -m pytest nous_duck/protocol/tests -v

  duckd:
    name: duckd 單元測試（模擬身體、模擬匯流排）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安裝依賴
        run: pip install -r nous_duck/robot/duckd/requirements-dev.txt
      - name: 執行測試
        working-directory: nous_duck/robot/duckd
        run: python -m pytest tests -v

  nous-adapter:
    name: Nous 端 adapter（型別檢查、對 mock 鴨子的測試）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 安裝依賴
        working-directory: nous_duck/nous_adapter
        run: npm ci
      - name: 型別檢查
        working-directory: nous_duck/nous_adapter
        run: npm run typecheck
      - name: 執行測試
        working-directory: nous_duck/nous_adapter
        run: npm test
